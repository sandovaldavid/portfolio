services:
    playwright:
        build:
            context: .
            dockerfile: docker/Dockerfile.test
            args:
                PLAYWRIGHT_VERSION: '1.62.1'
                BUN_VERSION: '1.3.14'
        image: portfolio-test:latest
        init: true
        ipc: host
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        working_dir: /workspace
        volumes:
            - '${HOST_WORKSPACE_FOLDER:-.}:/workspace:z'
            - '${HOST_WORKSPACE_FOLDER:-.}/.docker/runtime/node_modules:/workspace/node_modules:z'
            - '${HOST_WORKSPACE_FOLDER:-.}/.docker/runtime/home:/home/tester:z'
        environment:
            HOME: /home/tester
            CI: '${CI:-}'
            RUN_VISUAL_TESTS: '${RUN_VISUAL_TESTS:-}'
            E2E_USE_PRODUCTION_PREVIEW: '${E2E_USE_PRODUCTION_PREVIEW:-1}'
        ports:
            - '4322:4322'
