name: Setup Playwright browsers
description: Install pinned Playwright browsers with a shared binary cache keyed by bun.lock.

inputs:
    browsers:
        description: Space-separated browser names to install (e.g. "chromium" or "chromium firefox webkit").
        required: true
    install-deps:
        description: Install system dependencies with apt (required for webkit/firefox on fresh images).
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Cache Playwright browsers
          uses: actions/cache@v6
          with:
              path: ~/.cache/ms-playwright
              key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-playwright-

        - name: Install Playwright browsers
          shell: bash
          run: |
              if [ "${{ inputs.install-deps }}" = "true" ]; then
                bunx playwright install --with-deps ${{ inputs.browsers }}
              else
                bunx playwright install ${{ inputs.browsers }}
              fi
