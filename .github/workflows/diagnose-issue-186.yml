name: Finalize issue 186

on:
    pull_request:
        branches: [develop]

permissions:
    contents: write

concurrency:
    group: finalize-issue-186-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    finalize:
        if: github.head_ref == 'refactor/186-portfolio-retro-color-tokens'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0

            - uses: ./.github/actions/setup-bun

            - name: Apply final source corrections
              run: |
                  python <<'PY'
                  from pathlib import Path

                  layout = Path('src/app/layouts/Layout.astro')
                  layout_text = layout.read_text()
                  stale_theme_color = '\t\t<meta name="theme-color" content="#0096ff" />\n'
                  if stale_theme_color not in layout_text:
                      raise SystemExit('Expected stale theme-color metadata was not found.')
                  layout.write_text(layout_text.replace(stale_theme_color, ''))

                  contract = Path('tests/unit/design-system-color-contract.spec.ts')
                  contract_text = contract.read_text()
                  old_regex = "const rawColor = /#[0-9a-f]{3,8}\\b|\\b(?:rgb|rgba|hsl|hsla|oklab|oklch|lab|lch)\\(/i;"
                  new_regex = "const rawColor = /(?<!&)#[0-9a-f]{3,8}\\b|\\b(?:rgb|rgba|hsl|hsla|oklab|oklch|lab|lch)\\(/i;"
                  if old_regex not in contract_text:
                      raise SystemExit('Expected raw-color scanner expression was not found.')
                  contract.write_text(contract_text.replace(old_regex, new_regex))

                  inventory = Path('docs/design-system/portfolio-retro-color-inventory.md')
                  inventory_text = inventory.read_text()
                  header_row = '| `Migrated` | `src/widgets/header/ui/Header.astro` | Raw RGB/RGBA scroll effects and direct active-link ramp class | Header effect tokens and channel accent role |\n'
                  layout_row = '| `Migrated` | `src/app/layouts/Layout.astro` | Stale non-canonical `theme-color` metadata literal | Removed duplicate metadata color so browser chrome no longer owns an ungoverned palette value |\n'
                  if layout_row not in inventory_text:
                      if header_row not in inventory_text:
                          raise SystemExit('Expected inventory insertion point was not found.')
                      inventory.write_text(inventory_text.replace(header_row, header_row + layout_row))
                  PY

            - name: Format and remove temporary workflow
              run: |
                  bun run format
                  rm .github/workflows/diagnose-issue-186.yml

            - name: Commit finalized implementation
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git diff --cached --check
                  git commit -m 'chore(design-system): finalize token validation'
                  git push origin "HEAD:${HEAD_REF}"
