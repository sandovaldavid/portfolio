name: Temporary Smoke Alignment

on:
  push:
    branches:
      - fix/recruiter-facing-public-copy

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/recruiter-facing-public-copy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align smoke contracts with current public copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/e2e/design-system-colors.spec.ts': [
                  ('Portfolio OS', 'Portfolio CLI'),
              ],
              'tests/e2e/metadata-localization.spec.ts': [
                  (
                      'Backend-oriented Software Engineer with frontend experience, building reliable web products with .NET, Angular and TypeScript. Remote from Peru, open to international opportunities.',
                      'Software Engineer building maintainable web products and backend systems with clear technical decisions, automated validation and documented trade-offs. Remote from Peru, open to international opportunities.',
                  ),
                  (
                      'Ingeniero de software orientado a backend con experiencia frontend, que construye productos web confiables con .NET, Angular y TypeScript. Remoto desde Perú, disponible para oportunidades internacionales.',
                      'Ingeniero de software que construye productos web y sistemas backend mantenibles con decisiones técnicas claras, validación automatizada y trade-offs documentados. Remoto desde Perú, disponible para oportunidades internacionales.',
                  ),
                  ('Conoce a David Sandoval', 'Conoce cómo David Sandoval aborda la ingeniería de software'),
                  ("toContain('productos web confiables')", "toContain('sistemas backend mantenibles')"),
              ],
              'tests/e2e/smoke.spec.ts': [
                  ('Angular and reactive frontend architecture', 'Reactive frontend architecture'),
                  ('Angular y arquitectura frontend reactiva', 'Arquitectura frontend reactiva'),
                  ('The current repository defines the product boundary', 'Next.js 16, React 19 and Tailwind 4'),
                  ('El repositorio actual define el límite del producto', 'Next.js 16, React 19 y Tailwind 4'),
              ],
          }

          for file_name, changes in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'missing expected contract in {file_name}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Format updated tests
        run: bun x prettier --write tests/e2e/design-system-colors.spec.ts tests/e2e/metadata-localization.spec.ts tests/e2e/smoke.spec.ts

      - name: Keep helper workflow out of commit
        run: git restore .github/workflows/temporary-align-smoke.yml

      - name: Commit smoke alignment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/design-system-colors.spec.ts tests/e2e/metadata-localization.spec.ts tests/e2e/smoke.spec.ts
          git commit --no-verify -m "test(e2e): align recruiter-facing public contracts"
          git push origin HEAD:fix/recruiter-facing-public-copy
