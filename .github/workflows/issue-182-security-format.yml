name: Issue 182 Security Formatting

on:
    pull_request:
        branches: [develop]

permissions:
    contents: write

jobs:
    format:
        if: github.event.pull_request.head.ref == 'fix/182-restore-resume-assets'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Apply canonical formatting
              shell: bash
              run: |
                  set -euo pipefail

                  bun run format
                  changed=$(git diff --name-only --diff-filter=ACM)
                  unexpected=$(printf '%s\n' "$changed" | grep -Ev \
                      '^(scripts/validate-resume-assets\.mjs|tests/unit/resume-assets\.spec\.ts)$' || true)
                  if [ -n "$unexpected" ]; then
                      echo "::error::Unexpected files changed by formatting:"
                      printf '%s\n' "$unexpected"
                      exit 1
                  fi

                  if [ -z "$changed" ]; then
                      echo "No formatting changes required."
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add scripts/validate-resume-assets.mjs tests/unit/resume-assets.spec.ts
                  git commit -m "style(security): format resume asset validation"
                  git push origin "HEAD:${GITHUB_HEAD_REF}"
