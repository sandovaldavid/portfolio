name: Diagnose tooling issue 186

on:
    pull_request:
        branches: [develop]

permissions:
    contents: read

concurrency:
    group: diagnose-tooling-186-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    tooling:
        if: github.head_ref == 'refactor/186-portfolio-retro-color-tokens'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: ./.github/actions/setup-bun
            - name: Capture tooling typecheck output
              continue-on-error: true
              run: |
                  set -o pipefail
                  bun run typecheck:tooling 2>&1 | tee tooling-output.txt
            - uses: actions/upload-artifact@v7
              with:
                  name: issue-186-tooling-output
                  path: tooling-output.txt
                  if-no-files-found: error
                  retention-days: 1
