name: Diagnose lint issue 186

on:
    pull_request:
        branches: [develop]

permissions:
    contents: read

concurrency:
    group: diagnose-lint-186-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    lint:
        if: github.head_ref == 'refactor/186-portfolio-retro-color-tokens'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
            - uses: ./.github/actions/setup-bun
            - name: Capture lint output
              continue-on-error: true
              run: |
                  set -o pipefail
                  bun run lint 2>&1 | tee lint-output.txt
            - uses: actions/upload-artifact@v7
              with:
                  name: issue-186-lint-output
                  path: lint-output.txt
                  if-no-files-found: error
                  retention-days: 1
