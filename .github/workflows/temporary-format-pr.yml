name: Temporary PR Formatter

on:
  push:
    branches:
      - fix/recruiter-facing-public-copy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/recruiter-facing-public-copy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format tracked files
        run: bun run format

      - name: Keep helper workflow out of formatter commit
        run: git restore .github/workflows/temporary-format-pr.yml

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(content): apply repository formatter"
          git push origin HEAD:fix/recruiter-facing-public-copy
