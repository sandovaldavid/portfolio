name: Dependabot Devcontainer Sync

on:
    pull_request:
        types: [opened, synchronize]
        branches: [main]
        paths:
            - 'package.json'

permissions:
    contents: write

jobs:
    sync-devcontainer:
        name: Sync Dev Container Contracts
        if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Synchronize devcontainer contracts if needed
              run: node scripts/check-devcontainer.mjs --fix

            - name: Format tracked files if changed
              run: bun run format

            - name: Commit and push devcontainer synchronization
              run: |
                  if ! git diff --quiet .devcontainer/; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add .devcontainer/
                      git commit -m "chore(devcontainer): sync devcontainer contracts with package.json"
                      git push
                  fi
