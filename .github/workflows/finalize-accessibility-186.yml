name: Finalize accessibility issue 186

on:
    pull_request:
        branches: [develop]

permissions:
    contents: write

concurrency:
    group: finalize-accessibility-186-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    finalize:
        if: github.head_ref == 'refactor/186-portfolio-retro-color-tokens'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0

            - uses: ./.github/actions/setup-bun

            - name: Apply accessibility corrections
              run: |
                  python <<'PY'
                  from pathlib import Path

                  replacements = {
                      Path('src/widgets/research/ui/Research.astro'): [
                          (
                              'bg-button-primary-content text-button-primary-background px-2.5 py-1 font-bold uppercase tracking-widest animate-pulse whitespace-nowrap',
                              'bg-button-primary-content text-button-primary-background px-2.5 py-1 font-bold uppercase tracking-widest whitespace-nowrap',
                          ),
                      ],
                      Path('src/features/cli-terminal/ui/CLITerminalCatalog.astro'): [
                          (
                              'text-channel-portfolio-terminal-cyan/70 tracking-widest uppercase',
                              'text-channel-portfolio-terminal-cyan tracking-widest uppercase',
                          ),
                          (
                              'text-channel-portfolio-terminal-cyan/60 hidden sm:block',
                              'text-channel-portfolio-terminal-content-muted hidden sm:block',
                          ),
                          (
                              'placeholder:text-channel-portfolio-terminal-content/40',
                              'placeholder:text-channel-portfolio-terminal-content-muted',
                          ),
                          (
                              'text-channel-portfolio-terminal-content/40 uppercase tracking-widest hidden sm:block',
                              'text-channel-portfolio-terminal-content-muted uppercase tracking-widest hidden sm:block',
                          ),
                      ],
                      Path('src/features/cli-terminal/model/runtime.ts'): [
                          (
                              "muted: 'text-channel-portfolio-terminal-content/40'",
                              "muted: 'text-channel-portfolio-terminal-content-muted'",
                          ),
                      ],
                  }

                  for path, path_replacements in replacements.items():
                      text = path.read_text()
                      for old, new in path_replacements:
                          if text.count(old) != 1:
                              raise SystemExit(f'Expected exactly one match in {path}: {old}')
                          text = text.replace(old, new)
                      path.write_text(text)
                  PY

            - name: Format and remove temporary workflow
              run: |
                  bun run format
                  rm .github/workflows/finalize-accessibility-186.yml

            - name: Commit final accessibility implementation
              env:
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git diff --cached --check
                  git commit -m 'fix(design-system): preserve accessible token contrast'
                  git push origin "HEAD:${HEAD_REF}"
