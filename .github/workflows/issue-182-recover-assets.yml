name: Issue 182 Resume Asset Recovery

on:
    pull_request:
        branches: [develop]

permissions:
    contents: write

jobs:
    recover:
        if: github.event.pull_request.head.ref == 'fix/182-restore-resume-assets'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Capture the deployed canonical payload
              shell: bash
              run: |
                  set -euo pipefail

                  destination=recovery/public/resume
                  diagnostics=recovery/diagnostics
                  mkdir -p "$destination" "$diagnostics"

                  download() {
                      local filename="$1"
                      local url="$2"
                      local status

                      status=$(curl --location --silent --show-error \
                          --dump-header "$diagnostics/${filename}.headers" \
                          --output "$destination/$filename" \
                          --write-out '%{http_code}' \
                          "$url" || true)
                      printf '%s\n' "$status" > "$diagnostics/${filename}.status"
                      tr -d '\r' < "$diagnostics/${filename}.headers" \
                          > "$diagnostics/${filename}.headers.normalized"
                  }

                  download \
                      david-sandoval-resume.pdf \
                      https://sandovaldavid.com/resume/david-sandoval-resume.pdf
                  download \
                      david-sandoval-resume-es.pdf \
                      https://sandovaldavid.com/resume/david-sandoval-resume-es.pdf
                  download \
                      manifest.json \
                      https://sandovaldavid.com/resume/manifest.json

            - name: Upload recovery diagnostics
              uses: actions/upload-artifact@v7
              with:
                  name: issue-182-recovery-diagnostics
                  path: recovery
                  if-no-files-found: error
                  retention-days: 1

            - name: Validate the recovered canonical payload
              shell: bash
              run: |
                  set -euo pipefail

                  for filename in \
                      david-sandoval-resume.pdf \
                      david-sandoval-resume-es.pdf \
                      manifest.json; do
                      test "$(cat "recovery/diagnostics/${filename}.status")" = 200
                  done

                  for filename in \
                      david-sandoval-resume.pdf \
                      david-sandoval-resume-es.pdf; do
                      headers="recovery/diagnostics/${filename}.headers.normalized"
                      grep -qi '^content-type: application/pdf' "$headers"
                      grep -Eqi "^content-disposition: (attachment|inline); filename=\"${filename}\"" "$headers"
                  done

                  node scripts/validate-resume-assets.mjs recovery/public/resume

            - name: Upload reviewed recovery candidate
              uses: actions/upload-artifact@v7
              with:
                  name: issue-182-recovered-resume-assets
                  path: recovery/public/resume
                  if-no-files-found: error
                  retention-days: 1

            - name: Publish disposable asset candidate branch
              shell: bash
              env:
                  CANDIDATE_BRANCH: fix/182-resume-assets-recovery-candidate
              run: |
                  set -euo pipefail

                  if git ls-remote --exit-code --heads origin "$CANDIDATE_BRANCH" >/dev/null 2>&1; then
                      echo "::error::Candidate branch already exists: $CANDIDATE_BRANCH"
                      exit 1
                  fi

                  source_commit=$(node -e "const manifest=require('./recovery/public/resume/manifest.json'); process.stdout.write(manifest.sourceCommit)")
                  mkdir -p /tmp/recovered-resume-assets
                  cp recovery/public/resume/* /tmp/recovered-resume-assets/

                  git fetch --no-tags origin resume-assets
                  git switch --create "$CANDIDATE_BRANCH" FETCH_HEAD
                  rm -rf public/resume
                  mkdir -p public/resume
                  cp /tmp/recovered-resume-assets/* public/resume/

                  git add public/resume
                  test -n "$(git diff --cached --name-only)"
                  test "$(git diff --cached --name-only | wc -l)" -eq 3
                  git diff --cached --name-only | grep -Fxq public/resume/david-sandoval-resume.pdf
                  git diff --cached --name-only | grep -Fxq public/resume/david-sandoval-resume-es.pdf
                  git diff --cached --name-only | grep -Fxq public/resume/manifest.json

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "fix(resume): restore canonical PDFs from $source_commit"
                  git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
