name: Continuous Integration

on:
    pull_request:
        branches: [develop, main]

permissions:
    contents: read

concurrency:
    group: pr-quality-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    promotion-source:
        name: Promotion Source
        runs-on: ubuntu-latest
        steps:
            - name: Enforce develop-only promotion to main
              shell: bash
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
              run: |
                  set -euo pipefail

                  if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "develop" ]; then
                    echo "::error::Pull requests into main must use develop as the source branch."
                    exit 1
                  fi

                  echo "Accepted pull request route: ${HEAD_REF} -> ${BASE_REF}"

    validate:
        name: Code Quality & Commits
        runs-on: ubuntu-latest
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Check tracked-file formatting
              run: bun run format:check

            - name: Validate documentation links
              run: bun run check:docs

            - name: Validate Dev Container contracts
              run: bun run check:devcontainer

            - name: Validate localization contracts
              run: bun run check:i18n

            - name: Run lint and architecture checks
              run: bun run lint

            - name: Run Astro and tooling typechecks
              run: bun run typecheck

            - name: Validate squash-merge title
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: echo "${PR_TITLE} (#${PR_NUMBER})" | bunx commitlint

    test-unit:
        name: Unit Tests (Vitest)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Run unit tests
              run: bun run test:unit:ci

    build:
        name: Build & Bundle Analysis
        runs-on: ubuntu-latest
        outputs:
            build-url: ${{ steps.upload-build.outputs.artifact-url }}
            bundle-url: ${{ steps.upload-bundle.outputs.artifact-url }}
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Restore Astro cache
              uses: actions/cache@v6
              with:
                  path: .astro
                  key: ${{ runner.os }}-astro-pr-${{ hashFiles('bun.lock', 'src/**', 'astro.config.mjs') }}
                  restore-keys: |
                      ${{ runner.os }}-astro-pr-

            - name: Build production output
              run: bun run build

            - name: Generate bundle report
              run: bun run bundle:analyze

            - name: Enforce route performance budgets
              run: bun run performance:check

            - name: Upload production build
              id: upload-build
              uses: actions/upload-artifact@v7
              with:
                  name: pr-build-output
                  path: dist/
                  if-no-files-found: error
                  retention-days: 1

            - name: Upload bundle report
              id: upload-bundle
              uses: actions/upload-artifact@v7
              with:
                  name: pr-bundle-analysis
                  path: |
                      bundle-analysis/
                      performance-report/
                  if-no-files-found: error
                  retention-days: 7

    smoke:
        name: Playwright Chromium Smoke
        runs-on: ubuntu-latest
        needs: build
        outputs:
            report-url: ${{ steps.upload-report.outputs.artifact-url }}
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Download production build
              uses: actions/download-artifact@v8
              with:
                  name: pr-build-output
                  path: dist

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Run Chromium smoke and axe gates
              run: bun run test:e2e:smoke

            - name: Upload Playwright diagnostics
              id: upload-report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: pr-playwright-smoke
                  path: |
                      playwright-report/
                      test-results/
                      test-results.json
                      junit-results.xml
                  if-no-files-found: warn
                  retention-days: 7

    design-system-evidence:
        name: Portfolio Retro Visual Evidence
        runs-on: ubuntu-latest
        needs: build
        outputs:
            evidence-url: ${{ steps.upload-evidence.outputs.artifact-url }}
        steps:
            - name: Checkout pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Setup repository
              uses: ./.github/actions/setup-bun

            - name: Checkout exact pull request base
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: baseline
                  persist-credentials: false

            - name: Install and build baseline
              working-directory: baseline
              run: |
                  bun install --frozen-lockfile
                  bun run build

            - name: Download pull request build
              uses: actions/download-artifact@v8
              with:
                  name: pr-build-output
                  path: dist

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Capture exact base and head evidence
              env:
                  DESIGN_SYSTEM_BEFORE_DIR: baseline
                  DESIGN_SYSTEM_AFTER_DIR: .
                  DESIGN_SYSTEM_EVIDENCE_DIR: design-system-evidence
              run: bun run screenshots:design-system

            - name: Upload before and after evidence
              id: upload-evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: portfolio-retro-color-evidence
                  path: design-system-evidence/
                  if-no-files-found: warn
                  retention-days: 7

    summary:
        name: PR Summary Report
        runs-on: ubuntu-latest
        needs: [promotion-source, validate, test-unit, build, smoke, design-system-evidence]
        if: always()
        steps:
            - name: Write proportional CI summary
              shell: bash
              run: |
                  {
                    echo "## Pull request quality summary"
                    echo
                    echo "| Gate | Result |"
                    echo "|---|---|"
                    echo "| Promotion source policy | ${{ needs.promotion-source.result }} |"
                    echo "| Code quality and squash title | ${{ needs.validate.result }} |"
                    echo "| Unit tests | ${{ needs.test-unit.result }} |"
                    echo "| Production build and bundle report | ${{ needs.build.result }} |"
                    echo "| Chromium smoke and axe | ${{ needs.smoke.result }} |"
                    echo "| Portfolio Retro before/after evidence | ${{ needs.design-system-evidence.result }} |"
                    echo
                    echo "Full desktop-browser and Lighthouse suites run after integration into main; extended device and maintained visual suites run on the scheduled/manual pipeline."
                  } >> "$GITHUB_STEP_SUMMARY"
