version: 2
updates:
    # Bun dependencies managed through package.json and bun.lock.
    # Version updates integrate through develop. With target-branch set,
    # Dependabot security updates remain default-branch managed by GitHub.
    - package-ecosystem: 'bun'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
      pull-request-branch-name:
          separator: '/'
      commit-message:
          prefix: 'chore(deps)'
      reviewers:
          - 'sandovaldavid'
      assignees:
          - 'sandovaldavid'
      open-pull-requests-limit: 5
      rebase-strategy: 'auto'
      groups:
          minor-patch-updates:
              update-types:
                  - 'minor'
                  - 'patch'
          major-updates:
              update-types:
                  - 'major'

    # GitHub Actions version updates follow the same integration branch.
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '10:00'
      pull-request-branch-name:
          separator: '/'
      commit-message:
          prefix: 'ci(actions)'
      reviewers:
          - 'sandovaldavid'
      groups:
          github-actions:
              patterns:
                  - '*'
